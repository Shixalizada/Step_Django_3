{% extends "base.html" %}

{% block title %}Son postlar{% endblock %}

{% block content %}
  <h1>Son 3 post</h1>

  <ol class="list">
    {% for post in posts %}
      <li>
        {{ forloop.counter }}.
        <a href="{% url 'blog:post_detail' post.id %}">{{ post.title }}</a>
        <span>{{ post.created_at|date:"d.m.Y" }}</span>
      </li>
    {% empty %}
      <li>Hələ dərc olunmuş post yoxdur.</li>
    {% endfor %}
  </ol>
{% endblock %}
