<article class="card">
  <p class="meta">
    <a href="{% url 'blog:category_detail' post.category %}" class="badge">{{ post.category }}</a>
    {{ post.created_at|date:"d.m.Y" }}
    {% if post.is_featured %}
      · <strong>★ Seçilmiş</strong>
    {% endif %}
  </p>

  <h2><a href="{% url 'blog:post_detail' post.id %}">{{ post.title }}</a></h2>
  <p>{{ post.content|truncatewords:12 }}</p>
  <p class="author">
    <a href="{% url 'blog:author_posts' post.author %}">@{{ post.author }}</a>
  </p>
</article>
